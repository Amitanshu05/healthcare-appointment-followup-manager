server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/hospital_db?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  # Mail configuration (SMTP)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SMTP_USERNAME:${SPRING_MAIL_USERNAME:vashishtharsh6@gmail.com}}
    password: ${SMTP_PASSWORD:${SPRING_MAIL_PASSWORD:suxonziqwqqblvsu}}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Third-party integrations
integrations:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-pro}
  openai:
    api-key: ${OPENAI_API_KEY}
  google:
    calendar:
      client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_CALENDAR_CLIENT_ID}}
      client-secret: ${GOOGLE_CLIENT_SECRET:${GOOGLE_CALENDAR_CLIENT_SECRET}}
      redirect-uri: http://localhost:8080/api/calendar/callback
